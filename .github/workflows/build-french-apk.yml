name: Build French APK

on:
  pull_request:
    branches:
      - claude/spanish-app-french-adaptation-hb231s
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Validate course data
        run: |
          npm run typecheck
          npm run test:data

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        run: |
          mkdir -p dist
          find android/app/build/outputs/apk/release -type f -name '*.apk' -exec cp {} dist/French-Verbs-Trainer-v1.1.1-unsigned.apk \;
          test -s dist/French-Verbs-Trainer-v1.1.1-unsigned.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: French-Verbs-Trainer-v1.1.1-unsigned
          path: dist/French-Verbs-Trainer-v1.1.1-unsigned.apk
          if-no-files-found: error
          retention-days: 7
