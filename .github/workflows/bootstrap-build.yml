name: Build French Verbs Trainer APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: french-verbs-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: app
        shell: bash
        run: |
          VERSION=$(node -e "process.stdout.write(require('./package.json').version)")
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and content audits
        run: npm run typecheck

      - name: Validate verb database
        run: npm run test:data

      - name: Check forms against reference
        run: npm run test:forms

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain > ../gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== GRADLE FAILURE (last 240 lines) ====="
            tail -n 240 ../gradle-build.log
            exit "$status"
          fi

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log-${{ github.run_number }}
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Collect universal APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk"

      - name: Build arm64-only APK
        shell: bash
        run: |
          python3 - <<'PATCH'
          from pathlib import Path
          path = Path('android/app/build.gradle')
          src = path.read_text()
          marker = "ndk { abiFilters 'arm64-v8a' }"
          assert marker not in src, 'abiFilters уже задан'
          at = src.index('defaultConfig {') + len('defaultConfig {')
          path.write_text(src[:at] + '\n        ' + marker + src[at:])
          PATCH
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures=arm64-v8a
          cd ..
          cp android/app/build/outputs/apk/release/*.apk \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}-arm64.apk"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: French-Verbs-Trainer-v${{ steps.app.outputs.version }}
          path: |
            dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk
            dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}-arm64.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish APKs as release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk" \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}-arm64.apk" \
            --title "French Verbs Trainer v${{ steps.app.outputs.version }} (build ${{ github.run_number }})" \
            --target "${{ github.sha }}" \
            --notes "Автосборка из ветки ${{ github.ref_name }}, коммит ${{ github.sha }}."