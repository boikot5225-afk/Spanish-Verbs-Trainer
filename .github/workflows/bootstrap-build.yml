name: Build Spanish Verbs Trainer APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spanish-verbs-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Раннер GitHub, а не свой: репозиторий публичный, а свой раннер на публичном
    # репозитории — это чужой код из форкнутого pull request, выполняемый на твоей
    # машине. Минуты и хранилище артефактов для публичных репозиториев бесплатны,
    # так что причина переезжать на свой отпала. ANDROID_HOME образ задаёт сам.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: app
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Validate verb database
        run: npm run test:data

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      # prebuild --clean каждый раз кладёт debug.keystore из шаблона Expo, и им же
      # подписывается релиз. Версия шаблона плавающая, поэтому ключ не оставляем
      # на его усмотрение: подставляем собственную копию того же ключа, а потом
      # всё равно сверяем отпечаток. Подставить без сверки — не заметить подмены,
      # сверять без подстановки — упереться в красную сборку вместо APK.
      - name: Pin signing key
        shell: bash
        run: cp android-signing/debug.keystore android/app/debug.keystore

      - name: Verify signing key
        shell: bash
        run: |
          key="android/app/debug.keystore"
          expected="FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C"

          if [ ! -f "$key" ]; then
            echo "Signing key is missing: $key"
            exit 1
          fi

          actual="$(keytool -exportcert \
            -keystore "$key" \
            -storepass android \
            -alias androiddebugkey 2>/dev/null \
            | sha256sum | awk '{print toupper($1)}')"

          if [ "$actual" != "$expected" ]; then
            echo "Signing certificate mismatch"
            echo "Expected: $expected"
            echo "Actual:   $actual"
            exit 1
          fi

          echo "Signing certificate matches v1.15.0"

      - name: Build release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain > ../gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== GRADLE FAILURE (last 240 lines) ====="
            tail -n 240 ../gradle-build.log
            exit "$status"
          fi

      # Лог нужен только когда сборка сломалась. Раньше он выгружался всегда и
      # стоял перед сбором APK: когда кончилось место под артефакты, упал именно
      # он — и утащил за собой выгрузку самого APK, хотя тот собрался нормально.
      # Теперь шаг не выполняется на успешной сборке и не может её завалить.
      - name: Upload Gradle diagnostic log
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk \
            "dist/Spanish-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk"

      # APK весит около 33 МБ, а бесплатного места под артефакты 500 МБ — при
      # хранении по умолчанию (90 дней) полутора десятков сборок хватает, чтобы
      # квота кончилась и выгрузка начала падать.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spanish-Verbs-Trainer-v${{ steps.app.outputs.version }}
          path: dist/Spanish-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 14
