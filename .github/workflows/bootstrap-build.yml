name: Build French Verbs Trainer APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: french-verbs-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: app
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Validate verb database
        run: npm run test:data

      - name: Check forms against reference
        run: npm run test:forms

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build release APK
        shell: bash
        run: |
          cd android
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace --console=plain > ../gradle-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "===== GRADLE FAILURE (last 240 lines) ====="
            tail -n 240 ../gradle-build.log
            exit "$status"
          fi

      - name: Upload Gradle diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk"

      # Universal APK везёт все четыре архитектуры и весит ~62 МиБ.
      # Отдельная сборка под arm64-v8a — ~28 МиБ, а на телефонах нужна только она.
      - name: Build arm64-only APK
        shell: bash
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PreactNativeArchitectures=arm64-v8a
          cd ..
          cp android/app/build/outputs/apk/release/*.apk \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}-arm64.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: French-Verbs-Trainer-v${{ steps.app.outputs.version }}
          path: dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk
          if-no-files-found: error

      # Артефакты Actions лежат в хранилище, закрытом для части клиентов,
      # поэтому APK дублируется релизом — оттуда его можно скачать напрямую.
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}.apk" \
            "dist/French-Verbs-Trainer-v${{ steps.app.outputs.version }}-arm64.apk" \
            --title "French Verbs Trainer v${{ steps.app.outputs.version }} (build ${{ github.run_number }})" \
            --target "${{ github.sha }}" \
            --notes "Автосборка из ветки ${{ github.ref_name }}, коммит ${{ github.sha }}." 
