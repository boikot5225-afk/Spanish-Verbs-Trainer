name: Apply search and full tenses patch

on:
  pull_request:
    branches:
      - ella-full-database
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'search-full-tenses' || github.ref_name == 'search-full-tenses'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patch branch
        uses: actions/checkout@v4
        with:
          ref: search-full-tenses
          fetch-depth: 0

      - name: Verify and unpack patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .patch/search-tenses.b64)" -eq 31032
          echo "cee3f84d3c9d0b2e086e6a637d8012897a1e522235f7483f19c5e412a931f0db  .patch/search-tenses.b64" | sha256sum --check
          base64 --decode .patch/search-tenses.b64 > /tmp/search-tenses-patch.tar.xz
          echo "f7f8f2814e34948647f5b3255f86519ce1633f78c9b0a7d77b715849f233932e  /tmp/search-tenses-patch.tar.xz" | sha256sum --check
          tar -xJf /tmp/search-tenses-patch.tar.xz

      - name: Save normal source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .patch
          rm -f .github/workflows/apply-search-tenses.yml
          git add -A
          git commit -m "feat: add full tense catalog and conjugated-form search"
          git push origin HEAD:search-full-tenses
